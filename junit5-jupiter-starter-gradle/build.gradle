plugins {
	id 'java'
	id 'idea' // optional (to generate IntelliJ IDEA project files)
	id 'jacoco'
}

// Dossier de build hors de OneDrive (OneDrive verrouille build/ et empêche Gradle de le vider)
layout.buildDirectory = file("${System.getProperty('user.home')}/gradle-builds/${rootProject.name}")

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
	testImplementation 'org.assertj:assertj-core:3.26.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"

	}
	finalizedBy jacocoTestReport


}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.outputLocation=layout.buildDirectory.dir('reports/jacoco/test')
		// dossier et fichier de rangement par défaut, mais modifiable, comme par exemple :
		// html.outputLocation=layout.projectDirectory.dir('reports/jacoco/test')
	}
}