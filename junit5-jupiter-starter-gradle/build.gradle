plugins {
	id 'java'
	id 'idea' // optional (to generate IntelliJ IDEA project files)
}

// Dossier de build hors de OneDrive (OneDrive verrouille build/ et empêche Gradle de le vider)
layout.buildDirectory = file("${System.getProperty('user.home')}/gradle-builds/${rootProject.name}")

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
	testImplementation 'org.assertj:assertj-core:3.26.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}
